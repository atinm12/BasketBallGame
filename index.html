<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buzzer Beater</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header id="hud">
      <div class="stat"><span class="label">Score</span><span id="score">0</span></div>
      <div class="stat"><span class="label">Time</span><span id="time">1:00</span></div>
    </header>

    <div id="stage">
      <canvas id="court"></canvas>
    </div>
  </div>

  <!-- Plain scripts (not ES modules) so the game opens straight from the file system.
       Order matters: each file uses the ones above it. -->
  <script src="js/constants.js"></script>
  <script src="js/court.js"></script>
  <script src="js/player.js"></script>
  <script src="js/meter.js"></script>
  <script src="js/state.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
